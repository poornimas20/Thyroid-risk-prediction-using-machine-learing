<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Register | ThyroAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--primary:#0d9488;--secondary:#0891b2;--accent:#0d9488;--danger:#dc2626;--bg:#f8fafc;--border:#e2e8f0;--muted:#64748b}
    *{box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:#0f172a;min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center}
    
    .card-wrap{position:relative;z-index:1;width:100%;max-width:380px;padding:1.2rem}
    .brand-row{text-align:center;margin-bottom:1.4rem}
    .hero-icon{width:56px;height:56px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:1.6rem;margin-bottom:.7rem;box-shadow:0 8px 24px rgba(13,148,136,.25)}
    .brand{font-family:'Outfit',sans-serif;font-weight:700;font-size:1.3rem;display:block}
    .glass{background:#ffffff;border:1px solid var(--border);border-radius:16px;padding:1.8rem;box-shadow:0 1px 3px rgba(15,23,42,.08)}
    h2{font-family:'Outfit',sans-serif;font-weight:600;font-size:1.1rem;margin-bottom:.2rem;color:#0f172a}
    .sub{font-size:.8rem;color:var(--muted);margin-bottom:1.3rem}
    label.lbl{font-size:.78rem;font-weight:500;color:#334155;margin-bottom:4px;display:block}
    .inp{background:#ffffff;border:1px solid var(--border);border-radius:8px;color:#0f172a;padding:.6rem .85rem;font-size:.88rem;width:100%;margin-bottom:1rem;transition:border-color .25s,box-shadow .25s}
    .inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,148,136,.12)}
    .hint{font-size:.67rem;color:var(--muted);margin:-.7rem 0 1rem 2px}
    .btn-run{background:linear-gradient(135deg,var(--primary),var(--secondary));border:none;border-radius:11px;padding:.75rem 2rem;font-family:'Outfit',sans-serif;font-weight:600;font-size:.92rem;color:#fff;width:100%;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 16px rgba(13,148,136,.3)}
    .btn-run:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(13,148,136,.4)}
    .alt-link{text-align:center;font-size:.82rem;color:var(--muted);margin-top:1.2rem}
    .alt-link a{color:var(--primary);text-decoration:none;font-weight:500}
    .flash{border-radius:9px;padding:.6rem .9rem;font-size:.8rem;margin-bottom:1rem}
    .flash-error{background:rgba(220,38,38,.08);color:#dc2626;border:1px solid rgba(220,38,38,.2)}
    .flash-success{background:rgba(13,148,136,.08);color:#0d9488;border:1px solid rgba(13,148,136,.2)}
  </style>
</head>
<body>
  <div class="card-wrap">
    <div class="brand-row">
      <div class="hero-icon"><i class="bi bi-heart-pulse-fill"></i></div>
      <span class="brand" style="background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">ThyroAI</span>
    </div>
    <div class="glass">
      <h2>Create your account</h2>
      <p class="sub">Sign up to save your assessments and track risk trends.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, msg in messages %}
          <div class="flash {{ 'flash-error' if category=='error' else 'flash-success' }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <form method="POST">
        <label class="lbl">Username</label>
        <input class="inp" type="text" name="username" required minlength="3" autofocus/>
        <label class="lbl">Password</label>
        <input class="inp" type="password" name="password" required minlength="6"/>
        <div class="hint">At least 6 characters</div>
        <label class="lbl">Confirm Password</label>
        <input class="inp" type="password" name="confirm" required minlength="6"/>
        <button class="btn-run" type="submit"><i class="bi bi-person-plus me-1"></i>Create Account</button>
      </form>
      <div class="alt-link">Already have an account? <a href="/login">Log in</a></div>
    </div>
  </div>
</body>
</html>
